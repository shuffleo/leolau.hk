<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Reader</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            line-height: 1.6;
            color: #37352f;
            background-color: #ffffff;
            padding: 0;
            margin: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 96px 96px 96px 96px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 48px 24px;
            }
        }

        /* Markdown Content Styling */
        .markdown-content {
            font-size: 16px;
            line-height: 1.7;
            color: #37352f;
        }

        .markdown-content h1 {
            font-size: 40px;
            font-weight: 700;
            line-height: 1.2;
            margin-top: 2em;
            margin-bottom: 4px;
            color: #37352f;
        }

        .markdown-content h2 {
            font-size: 30px;
            font-weight: 600;
            line-height: 1.3;
            margin-top: 1.4em;
            margin-bottom: 1px;
            color: #37352f;
        }

        .markdown-content h3 {
            font-size: 24px;
            font-weight: 600;
            line-height: 1.3;
            margin-top: 1em;
            margin-bottom: 1px;
            color: #37352f;
        }

        .markdown-content h4 {
            font-size: 20px;
            font-weight: 600;
            line-height: 1.3;
            margin-top: 0.75em;
            margin-bottom: 1px;
            color: #37352f;
        }

        .markdown-content p {
            margin-top: 0.5em;
            margin-bottom: 0.5em;
            color: #37352f;
        }

        .markdown-content ul,
        .markdown-content ol {
            margin-top: 0.5em;
            margin-bottom: 0.5em;
            padding-left: 1.625em;
        }

        .markdown-content li {
            margin-top: 0.25em;
            margin-bottom: 0.25em;
        }

        .markdown-content ul {
            list-style-type: disc;
        }

        .markdown-content ol {
            list-style-type: decimal;
        }

        .markdown-content blockquote {
            border-left: 3px solid #e9e9e7;
            padding-left: 14px;
            margin: 6px 0;
            color: #787774;
        }

        .markdown-content code {
            background-color: rgba(135, 131, 120, 0.15);
            border-radius: 3px;
            padding: 0.2em 0.4em;
            font-size: 0.9em;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
        }

        .markdown-content pre {
            background-color: #f7f6f3;
            border-radius: 3px;
            padding: 1em;
            overflow-x: auto;
            margin: 1em 0;
        }

        .markdown-content pre code {
            background-color: transparent;
            padding: 0;
            font-size: 0.85em;
        }

        .markdown-content a {
            color: #0b7bc1;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .markdown-content a:hover {
            color: #0a6ba8;
        }

        .markdown-content hr {
            border: none;
            border-top: 1px solid #e9e9e7;
            margin: 2em 0;
        }

        .markdown-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 1em 0;
        }

        .markdown-content table th,
        .markdown-content table td {
            border: 1px solid #e9e9e7;
            padding: 6px 13px;
            text-align: left;
        }

        .markdown-content table th {
            background-color: #f7f6f3;
            font-weight: 600;
        }

        .markdown-content img {
            max-width: 100%;
            height: auto;
            border-radius: 3px;
            margin: 1.5em auto;
            display: block;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        /* YouTube embed container */
        .youtube-embed {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            height: 0;
            overflow: hidden;
            margin: 1.5em 0;
            border-radius: 3px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .youtube-embed iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .markdown-content strong {
            font-weight: 600;
        }

        .markdown-content em {
            font-style: italic;
        }

        /* First element spacing */
        .markdown-content > *:first-child {
            margin-top: 0;
        }

        /* Loading state */
        .loading {
            text-align: center;
            padding: 2em;
            color: #787774;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="content" class="markdown-content">
            <div class="loading">Loading content...</div>
        </div>
    </div>

    <script>
        // Default markdown file to load (in the same directory as this HTML file)
        const DEFAULT_MD_FILE = 'content.md';

        // Extract YouTube video ID from various URL formats
        function getYouTubeId(url) {
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\n?#]+)/,
                /youtube\.com\/watch\?.*v=([^&\n?#]+)/
            ];
            
            for (const pattern of patterns) {
                const match = url.match(pattern);
                if (match) return match[1];
            }
            return null;
        }

        // Convert YouTube links to embedded players
        function processYouTubeEmbeds(html) {
            // Create a temporary container to work with the HTML
            const temp = document.createElement('div');
            temp.innerHTML = html;
            
            // Find all links
            const links = temp.querySelectorAll('a');
            links.forEach(link => {
                const href = link.getAttribute('href');
                if (href) {
                    const videoId = getYouTubeId(href);
                    if (videoId) {
                        // Replace the link with an embedded player
                        const embedDiv = document.createElement('div');
                        embedDiv.className = 'youtube-embed';
                        embedDiv.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                        link.parentNode.replaceChild(embedDiv, link);
                    }
                }
            });
            
            return temp.innerHTML;
        }

        // Improve image handling
        function improveImageHandling(html) {
            const temp = document.createElement('div');
            temp.innerHTML = html;
            
            // Find all images and ensure they're properly styled
            const images = temp.querySelectorAll('img');
            images.forEach(img => {
                // Add loading="lazy" for better performance
                img.setAttribute('loading', 'lazy');
                // Ensure images are centered if they're in a paragraph
                if (img.parentElement.tagName === 'P') {
                    img.parentElement.style.textAlign = 'center';
                }
            });
            
            return temp.innerHTML;
        }

        // Render markdown
        function renderMarkdown(content) {
            const contentDiv = document.getElementById('content');
            if (typeof marked !== 'undefined') {
                // Configure marked options
                marked.setOptions({
                    breaks: true,
                    gfm: true
                });
                let html = marked.parse(content);
                
                // Process YouTube embeds
                html = processYouTubeEmbeds(html);
                
                // Improve image handling
                html = improveImageHandling(html);
                
                contentDiv.innerHTML = html;
            } else {
                contentDiv.innerHTML = '<p>Error: Marked.js library failed to load.</p>';
            }
        }

        // Load markdown from file
        function loadContent() {
            const urlParams = new URLSearchParams(window.location.search);
            // Allow override via URL parameter, otherwise use default file
            const mdFile = urlParams.get('file') || DEFAULT_MD_FILE;
            
            fetch(mdFile)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Failed to load ${mdFile}. Make sure the file exists in the same directory.`);
                    }
                    return response.text();
                })
                .then(text => renderMarkdown(text))
                .catch(error => {
                    document.getElementById('content').innerHTML = 
                        `<div style="padding: 2em; color: #d32f2f;">
                            <h2>Error loading markdown file</h2>
                            <p><strong>${error.message}</strong></p>
                            <p>Make sure you have a file named <code>${mdFile}</code> in the same directory as this HTML file.</p>
                            <p>You can also specify a different file using the URL parameter: <code>?file=yourfile.md</code></p>
                        </div>`;
                });
        }

        // Initialize when page loads
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadContent);
        } else {
            loadContent();
        }
    </script>
</body>
</html>
